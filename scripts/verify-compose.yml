services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: codelife_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codelife_test"]
      interval: 3s
      timeout: 3s
      retries: 10
