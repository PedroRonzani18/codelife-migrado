services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: codelife
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5434:5432"]
    volumes: ["codelife-postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codelife"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  codelife-postgres-data:
